name: Validate Universe HQ Dashboard

on:
  pull_request:
    paths:
      - "hq.html"
      - "docs/UNIVERSE_HQ.md"
      - "tests/hq-front.test.mjs"
      - "index.html"
      - "factory.html"
      - ".github/workflows/validate-hq-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HQ dashboard and policy consistency
        run: node --test tests/hq-front.test.mjs
      - name: Check required pages
        run: |
          test -s hq.html
          test -s factory.html
          test -s index.html
          grep -q 'href="hq.html"' index.html
