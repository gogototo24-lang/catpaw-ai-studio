<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓掌煉金術 AI Studio</title><style>body{font-family:system-ui;background:#0d1020;color:#fff;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#171b32;border:1px solid #30375e;border-radius:18px;padding:18px;margin:14px 0}h1{color:#ffd36a}label{display:block;margin:12px 0 6px}select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #454d7a;background:#0f1428;color:#fff}button{background:#d79b25;color:#111;font-weight:800;margin-top:18px}.out{white-space:pre-wrap;line-height:1.7}</style></head><body><main class="wrap"><h1>🐾 貓掌煉金術 AI Studio <small>v1.4</small></h1><p>《貓掌江湖》CANON 鎖定短影音製作包產生器</p><p style="color:#9fdbff">CANON Lock｜首尾幀｜口白/BGM｜剪映｜YouTube Shorts</p><section class="card"><label>角色</label><select id="role"></select><label>片長</label><select id="dur"><option>15 秒</option><option>10 秒</option></select><label>風格</label><select id="style"><option>暗黑國風極武篇</option><option>冰霜電影武俠</option><option>皇族電影武俠</option></select><button onclick="brew()">開始煉製</button></section><section class="card"><h2>製作包</h2><div id="out" class="out">選擇角色後按「開始煉製」。</div></section></main><script>
const data={"舞魅喵":{hook:"她只出一劍，整條街的雷光都醒了。",move:"魅影雷舞",visual:"白色母喵、青綠眼、黑色蕾絲羽飾華服、深色華麗長劍、藍色雷電"},"星織霜雨":{hook:"她只開了一次傘，整座城市就結霜了。",move:"霜羽破千軍",visual:"銀灰母喵、藍白金華服、星織霜羽長傘、冰羽霜氣"},"白帝喵尊":{hook:"她沒有武器，一掌卻讓萬象歸寂。",move:"天外一念・萬象歸寂",visual:"雪白長毛母喵、湛藍眼、白銀雲紋長袍、淡金肩飾、無實體武器"},"月扇影喵":{hook:"黑扇一開，月影已封住退路。",move:"月影禁界",visual:"黑色母喵、紫眼、暗紫黑銀皇族華服、唯一武器黑色折扇"}};
function brew(){let r=role.value,d=dur.value,s=style.value,x=data[r];out.textContent=`【爆款標題】《貓掌江湖・${r}：${x.move}》\n\n【前2秒鉤子】${x.hook}\n\n【CANON鎖定】${x.visual}。全程角色一致，不換武器、不增生肢體、非血腥武戲。\n\n【3鏡分鏡｜${d}】\n鏡1：角色電影級亮相，環境能量開始異變。\n鏡2：招式「${x.move}」爆發，鏡頭高速跟拍並保持臉、服裝、武器一致。\n鏡3：能量收束，角色定格，留下下一集懸念。\n\n【PixVerse / Flow 提示核心】\n9:16 cinematic Taiwanese glove-puppet-inspired female cat wuxia, ${x.visual}, ${s}, dynamic cinematic camera, realistic cloth and fur physics, coherent anatomy, consistent face and costume, powerful ${x.move} energy effects, no blood, no gore, no weapon mutation, no extra limbs.\n\n【首幀】角色全身可辨識，武器與服裝依 CANON 鎖定，9:16 電影級構圖。\n\n【口白/BGM】角色專屬短句＋國風電影配樂；舞魅喵優先暗黑國風電子搖滾。\n\n【尾幀】同一角色、同一服裝與武器，招式餘韻＋Logo安全區。\n\n【剪映】0–2s鉤子｜2–6s亮相｜6–12s大招｜12–15s定格＋Logo。\n\n【YouTube Shorts】自動沿用角色名＋招式名＋#貓掌江湖 #Shorts\n\n【發布】#貓掌江湖 #${r} #AI影片 #武俠 #Shorts`;}</script><script src="data/characters.js"></script><script>
if(window.CATPAW_DB){
  CATPAW_DB.version="1.3";
  const sel=document.getElementById("role");
  sel.innerHTML="";
  Object.keys(CATPAW_DB.characters).forEach(name=>{const o=document.createElement("option");o.value=name;o.textContent=name;sel.appendChild(o);});
  document.querySelector("h1 small").textContent="v"+CATPAW_DB.version;
  Object.entries(CATPAW_DB.characters).forEach(([name,x])=>{
    if(data[name]){data[name].visual=x.look+"；"+x.weapon+"；"+x.element;data[name].move=x.move;}
  });
}
</script><script src="config/sync.js"></script><script>
function logProduction(){
 const item={time:new Date().toISOString(),character:role.value,duration:dur.value,style:style.value,version:"1.4"};
 const jobs=JSON.parse(localStorage.getItem("catpaw_jobs")||"[]");jobs.unshift(item);localStorage.setItem("catpaw_jobs",JSON.stringify(jobs.slice(0,50)));
}
const oldBrew=brew;brew=function(){oldBrew();logProduction();}
</script></body></html>
