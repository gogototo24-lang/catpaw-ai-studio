name: Validate P5 n8n Auth Check

on:
  pull_request:
    paths:
      - 'n8n/catpaw-p5-scout-auth-check.n8n.json'
      - 'docs/P5_N8N_SCOUT_KEY_SETUP.md'
      - 'tests/p5-n8n-auth-check.test.mjs'
      - '.github/workflows/validate-p5-n8n-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify n8n workflow is safe and contains no credentials
        run: node --test tests/p5-n8n-auth-check.test.mjs
